<svg xmlns="http://www.w3.org/2000/svg" width="760" height="275" viewBox="0 0 760 275">
<title>자원 사용량에 남은 양을 더하면 전체 가용량이 된다.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4b4b4b"/></marker></defs>
<rect width="760" height="275" rx="20" fill="#ffffff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="45" y="65" width="670" height="90" rx="8" fill="#eeeeee" stroke="#cfcfcf" stroke-width="2"/><rect x="45" y="65" width="469" height="90" rx="8" fill="#777777" stroke="#cfcfcf" stroke-width="2"/><text x="280" y="120" font-size="29" text-anchor="middle" fill="white" font-weight="700">사용량 14</text><text x="615" y="120" font-size="27" text-anchor="middle" fill="#242424" font-weight="650">여유 6</text><text x="380" y="220" font-size="27" text-anchor="middle" fill="#242424" font-weight="500">2x₁ + 3x₂ + s = 20   →   s = 20 − 14 = 6</text></g></svg>