<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450">
<title>현금이 발생한 시점을 맞춰 현재가치로 더한다.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4b4b4b"/></marker></defs>
<rect width="760" height="450" rx="20" fill="#ffffff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><path d="M100 210L670 210" fill="none" stroke="#4b4b4b" stroke-width="3" marker-end="url(#arrow)"/><path d="M165 210L165 300" fill="none" stroke="#4b4b4b" stroke-width="3" marker-end="url(#arrow)"/><path d="M585 210L585 75" fill="none" stroke="#4b4b4b" stroke-width="3" marker-end="url(#arrow)"/><text x="165" y="180" font-size="24" text-anchor="middle" fill="#242424" font-weight="500">현재</text><text x="165" y="342" font-size="30" text-anchor="middle" fill="#242424" font-weight="700">−100</text><text x="585" y="55" font-size="30" text-anchor="middle" fill="#242424" font-weight="700">+110</text><text x="585" y="250" font-size="24" text-anchor="middle" fill="#242424" font-weight="500">1년 뒤</text><text x="380" y="405" font-size="25" text-anchor="middle" fill="#242424" font-weight="500">할인율 5%: NPV = −100 + 110 / 1.05 ≈ 4.76</text></g></svg>