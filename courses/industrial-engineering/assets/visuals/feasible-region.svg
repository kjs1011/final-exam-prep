<svg xmlns="http://www.w3.org/2000/svg" width="760" height="425" viewBox="0 0 760 425">
<title>가능영역과 목적함수의 최적해</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4b4b4b"/></marker></defs>
<rect width="760" height="425" rx="20" fill="#ffffff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><path d="M100 310L665 310" fill="none" stroke="#4b4b4b" stroke-width="3" marker-end="url(#arrow)"/><path d="M100 310L100 40" fill="none" stroke="#4b4b4b" stroke-width="3" marker-end="url(#arrow)"/><path d="M100 310L500 310L100 110Z" fill="#e8e8e8" stroke="#4b4b4b" stroke-width="3"/><path d="M200 85L500 310" fill="none" stroke="#777777" stroke-width="3" stroke-dasharray="8 7"/><text x="300" y="40" font-size="21" text-anchor="middle" fill="#4b4b4b" font-weight="500">실선: x + y = 4</text><text x="550" y="40" font-size="21" text-anchor="middle" fill="#777777" font-weight="500">점선: Z = 12</text><text x="240" y="220" font-size="27" text-anchor="middle" fill="#242424" font-weight="700">가능영역</text><circle cx="500" cy="310" r="8" fill="#777777" stroke="#777777" stroke-width="2"/><text x="585" y="261" font-size="25" text-anchor="middle" fill="#242424" font-weight="700">최적해 (4, 0)</text><text x="585" y="295" font-size="25" text-anchor="middle" fill="#777777" font-weight="700">Z = 12</text><text x="85" y="346" font-size="22" text-anchor="middle" fill="#242424" font-weight="500">0</text><text x="500" y="346" font-size="22" text-anchor="middle" fill="#242424" font-weight="500">4</text><text x="75" y="119" font-size="22" text-anchor="middle" fill="#242424" font-weight="500">4</text><text x="680" y="320" font-size="25" text-anchor="middle" fill="#242424" font-weight="500">x</text><text x="95" y="29" font-size="25" text-anchor="middle" fill="#242424" font-weight="500">y</text><text x="380" y="391" font-size="24" text-anchor="middle" fill="#242424" font-weight="500">max Z = 3x + 2y     x + y ≤ 4, x ≥ 0, y ≥ 0</text></g></svg>