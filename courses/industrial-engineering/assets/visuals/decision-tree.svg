<svg xmlns="http://www.w3.org/2000/svg" width="760" height="425" viewBox="0 0 760 425">
<title>투자비 30과 성공·실패 확률을 고려하는 의사결정나무</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4b4b4b"/></marker></defs>
<rect width="760" height="425" rx="20" fill="#ffffff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="40" y="150" width="70" height="70" rx="14" fill="#e8e8e8" stroke="#cfcfcf" stroke-width="2"/><text x="75" y="195" font-size="22" text-anchor="middle" fill="#242424" font-weight="500">선택</text><circle cx="340" cy="160" r="34" fill="#e8e8e8" stroke="#4b4b4b" stroke-width="2"/><path d="M115 165L300 160" fill="none" stroke="#4b4b4b" stroke-width="3" marker-end="url(#arrow)"/><text x="215" y="130" font-size="24" text-anchor="middle" fill="#242424" font-weight="500">투자 −30</text><path d="M115 205L300 300" fill="none" stroke="#4b4b4b" stroke-width="3" marker-end="url(#arrow)"/><text x="220" y="288" font-size="23" text-anchor="middle" fill="#242424" font-weight="500">보류</text><text x="380" y="312" font-size="27" text-anchor="middle" fill="#242424" font-weight="700">0</text><path d="M375 145L550 70" fill="none" stroke="#4b4b4b" stroke-width="3" marker-end="url(#arrow)"/><path d="M375 177L550 235" fill="none" stroke="#4b4b4b" stroke-width="3" marker-end="url(#arrow)"/><text x="470" y="90" font-size="22" text-anchor="middle" fill="#242424" font-weight="500">성공 0.4</text><text x="470" y="230" font-size="22" text-anchor="middle" fill="#242424" font-weight="500">실패 0.6</text><rect x="565" y="35" width="165" height="70" rx="14" fill="#ffffff" stroke="#cfcfcf" stroke-width="2"/><text x="648" y="80" font-size="25" text-anchor="middle" fill="#242424" font-weight="500">유입 100</text><rect x="565" y="220" width="165" height="70" rx="14" fill="#ffffff" stroke="#cfcfcf" stroke-width="2"/><text x="648" y="265" font-size="25" text-anchor="middle" fill="#242424" font-weight="500">유입 20</text><text x="380" y="385" font-size="24" text-anchor="middle" fill="#242424" font-weight="700">기대 순수익 = 0.4×100 + 0.6×20 − 30 = 22</text></g></svg>