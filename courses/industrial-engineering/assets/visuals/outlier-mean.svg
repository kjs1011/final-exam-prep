<svg xmlns="http://www.w3.org/2000/svg" width="760" height="355" viewBox="0 0 760 355">
<title>큰 극단값 하나가 평균을 끌어올릴 수 있다. 중앙값과 함께 확인한다.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4b4b4b"/></marker></defs>
<rect width="760" height="355" rx="20" fill="#ffffff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><path d="M80 170L695 170" fill="none" stroke="#4b4b4b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="95" cy="170" r="8" fill="#4b4b4b" stroke="#4b4b4b" stroke-width="2"/><text x="95" y="135" font-size="25" text-anchor="middle" fill="#242424" font-weight="500">1</text><circle cx="140" cy="170" r="8" fill="#4b4b4b" stroke="#4b4b4b" stroke-width="2"/><text x="140" y="135" font-size="25" text-anchor="middle" fill="#242424" font-weight="500">2</text><circle cx="185" cy="170" r="8" fill="#4b4b4b" stroke="#4b4b4b" stroke-width="2"/><text x="185" y="135" font-size="25" text-anchor="middle" fill="#242424" font-weight="500">3</text><circle cx="230" cy="170" r="8" fill="#4b4b4b" stroke="#4b4b4b" stroke-width="2"/><text x="230" y="135" font-size="25" text-anchor="middle" fill="#242424" font-weight="500">4</text><circle cx="635" cy="170" r="8" fill="#4b4b4b" stroke="#4b4b4b" stroke-width="2"/><text x="635" y="135" font-size="25" text-anchor="middle" fill="#242424" font-weight="500">90</text><text x="230" y="250" font-size="27" text-anchor="middle" fill="#242424" font-weight="700">중앙값 = 3</text><text x="555" y="250" font-size="27" text-anchor="middle" fill="#242424" font-weight="700">평균 = 20</text><text x="380" y="310" font-size="21" text-anchor="middle" fill="#242424" font-weight="500">학습용 자료 · 눈금은 값에 비례하지 않음</text></g></svg>