<svg xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395">
<title>생산량 변화에 따라 어떤 비용이 달라지는지 구분한다. 직선은 학습용 개념도다.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4b4b4b"/></marker></defs>
<rect width="760" height="395" rx="20" fill="#ffffff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><path d="M95 280L680 280" fill="none" stroke="#4b4b4b" stroke-width="3" marker-end="url(#arrow)"/><path d="M95 280L95 40" fill="none" stroke="#4b4b4b" stroke-width="3" marker-end="url(#arrow)"/><path d="M110 220L640 220" fill="none" stroke="#a0a0a0" stroke-width="3"/><path d="M110 220L640 75" fill="none" stroke="#4b4b4b" stroke-width="3"/><text x="650" y="310" font-size="23" text-anchor="middle" fill="#242424" font-weight="500">생산량</text><text x="62" y="30" font-size="23" text-anchor="middle" fill="#242424" font-weight="500">비용</text><text x="480" y="208" font-size="23" text-anchor="middle" fill="#777777" font-weight="500">고정비</text><text x="455" y="90" font-size="22" text-anchor="middle" fill="#242424" font-weight="500">총비용 = 고정비 + 변동비</text><text x="380" y="354" font-size="23" text-anchor="middle" fill="#242424" font-weight="500">생산량이 바뀌어도 고정비는 관련 범위에서 일정하다.</text></g></svg>